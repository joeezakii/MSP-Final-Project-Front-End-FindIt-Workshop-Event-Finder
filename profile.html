<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindIt — My Profile & Digital Passes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwindtemplate.js"></script>
  <script src="interface.js"></script>
  <html lang="en" class="h-full scroll-smooth"></html>
</head>
<body class="min-h-full flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-300 bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">

  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-slate-200 dark:bg-slate-900/80 dark:border-slate-800 transition-colors duration-300">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center gap-3">
          <a href="home.html" class="flex items-center gap-2 font-bold text-xl tracking-tight text-slate-900 dark:text-white">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand-600 text-white font-black shadow-lg shadow-brand-500/30">
              F
            </span>
            <span>Find<span class="text-brand-500">It</span></span>
          </a>
        </div>

        <div class="hidden md:flex items-center gap-1">
          <a href="home.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800 transition">Events</a>
          <a href="workshops.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800 transition">Workshops</a>
          <a href="about.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800 transition">About Us</a>
          <a href="profile.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-900 bg-slate-200/80 border border-slate-300 dark:text-white dark:bg-slate-800/80 dark:border-slate-700/50 transition">My Profile</a>
          <a href="settings.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800 transition">Settings</a>
        </div>

        <div class="flex items-center gap-3">
          <div id="guest-auth-buttons" class="hidden items-center gap-3">
            <a href="index.html" class="px-4 py-2 text-sm font-medium text-slate-700 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white transition">Log In</a>
            <a href="index.html" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 rounded-xl transition shadow-lg shadow-brand-600/25">Register</a>
          </div>

          <div id="user-profile-menu" class="relative">
            <button type="button" onclick="toggleUserDropdown()" class="flex items-center gap-2 p-1 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition shadow-md focus:outline-none">
              <img id="user-avatar" src="" alt="Profile Picture" class="w-9 h-9 rounded-xl object-cover border border-slate-200 dark:border-slate-700" />
              <span id="user-display-name" class="text-xs font-semibold text-slate-800 dark:text-slate-200 pr-1 max-w-[100px] truncate hidden sm:inline-block">User</span>
              <svg class="w-4 h-4 text-slate-400 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-2xl shadow-2xl py-1.5 z-50 transition-all">
              <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-700/60">
                <p id="dropdown-user-name" class="text-xs font-bold text-slate-900 dark:text-white truncate">User Name</p>
                <p id="dropdown-user-email" class="text-[11px] text-slate-400 truncate">user@fcai.cu.edu.eg</p>
              </div>
              <a href="profile.html" class="flex items-center gap-2.5 px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition">My Profile</a>
              <a href="settings.html" class="flex items-center gap-2.5 px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition">Settings</a>
              <div class="border-t border-slate-100 dark:border-slate-700/60 my-1"></div>
              <button type="button" onclick="handleLogout()" class="w-full flex items-center gap-2.5 px-4 py-2 text-xs font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10 transition text-left">Log Out</button>
            </div>
          </div>

          <button id="theme-toggle-btn" onclick="toggleTheme()" type="button" class="p-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:text-white transition focus:outline-none shadow-md" aria-label="Toggle Theme">
            <svg id="theme-sun-icon" class="w-5 h-5 text-amber-500 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-moon-icon" class="w-5 h-5 text-slate-700 fill-none stroke-current stroke-2 hidden" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
    
    <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-xl">
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6">
        <img id="profile-banner-avatar" src="" alt="Avatar" class="w-20 h-20 rounded-2xl object-cover border-2 border-brand-500 shadow-md" />
        <div class="space-y-1.5 flex-grow">
          <h1 id="profile-banner-name" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">User Name</h1>
          <p id="profile-banner-meta" class="text-sm text-slate-500 dark:text-slate-400 font-medium">user@fcai.cu.edu.eg • Sophomore • Male</p>
          <div class="flex flex-wrap items-center gap-3 pt-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-semibold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Active Student Account
            </span>
            <span id="booking-count-badge" class="inline-flex items-center px-3 py-1 rounded-xl text-xs font-semibold bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20">
              0 Events Registered
            </span>
          </div>
        </div>
      </div>
    </div>

  
    <div class="space-y-6">
      <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">My Booked Workshops & Passes</h2>
      <div id="bookings-container" class="grid grid-cols-1 gap-6">
      </div>
    </div>

  </main>

  <script src="menu.js"></script>
  <script src="topics.js"></script>
</body>
</html>
