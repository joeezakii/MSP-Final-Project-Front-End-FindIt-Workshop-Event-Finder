<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHub — My Profile & Digital Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwindtemplate.js"></script>
  <script src="interface.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="min-h-full flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-300 bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">

  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-slate-200 dark:bg-slate-900/80 dark:border-slate-800 transition-colors duration-300">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center gap-3">
          <a href="index.html" class="flex items-center gap-2 font-bold text-xl tracking-tight text-slate-900 dark:text-white">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand-600 text-white font-black shadow-lg shadow-brand-500/30">
              E
            </span>
            <span>Event<span class="text-brand-500">Hub</span></span>
          </a>
        </div>

        <div class="hidden md:flex items-center gap-1">
          <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800 transition">Events</a>
          <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800 transition">Workshops</a>
          <a href="#" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800 transition">About Us</a>
          <a href="profile.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-900 bg-slate-200/80 border border-slate-300 dark:text-white dark:bg-slate-800/80 dark:border-slate-700/50 transition">My Profile</a>
        </div>

        <div class="flex items-center gap-3">
          <button id="theme-toggle-btn" onclick="toggleTheme()" type="button" class="p-2 rounded-xl border border-slate-300 bg-slate-100 text-slate-700 hover:bg-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-700 transition focus:outline-none" aria-label="Toggle Theme">
            <svg id="theme-sun-icon" class="w-5 h-5 text-amber-500 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-moon-icon" class="w-5 h-5 text-slate-700 fill-none stroke-current stroke-2 hidden" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <button onclick="handleLogout()" class="px-4 py-2 text-sm font-semibold text-rose-600 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl transition">
            Log Out
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <div class="bg-white border border-slate-200 dark:bg-slate-800/60 dark:border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-xl mb-10 transition">
      <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
        <div class="w-20 h-20 rounded-2xl bg-brand-600 text-white flex items-center justify-center font-bold text-3xl shadow-lg shadow-brand-500/30">
          <span id="user-avatar">Y</span>
        </div>
        <div class="flex-grow">
          <h1 id="user-name-heading" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Student User</h1>
          <p id="user-email-text" class="text-slate-500 dark:text-slate-400 text-sm mt-1">student@fcai.cu.edu.eg</p>
          <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3 mt-4">
            <span class="px-3 py-1 text-xs font-semibold rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
              Active Student Account
            </span>
            <span id="booking-count-badge" class="px-3 py-1 text-xs font-semibold rounded-lg bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20">
              2 Events Registered
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">My Booked Workshops & Passes</h2>
    </div>

    <div id="bookings-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

    <div id="no-bookings-view" class="hidden text-center py-16 bg-white border border-slate-200 dark:bg-slate-800/40 dark:border-slate-700/50 rounded-3xl p-8">
      <svg class="w-16 h-16 text-slate-400 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
      </svg>
      <h3 class="text-lg font-bold text-slate-800 dark:text-slate-200">No Workshop Bookings Found</h3>
      <p class="text-slate-500 text-sm mt-1 mb-6">You haven't registered for any events or workshops yet.</p>
      <a href="index.html" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-semibold text-sm transition">
        Browse Workshops
      </a>
    </div>

  </main>

  <script src="profile.js"></script>
</body>
</html>
