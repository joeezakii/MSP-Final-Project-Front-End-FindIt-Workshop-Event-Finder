<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHub — Register an Account/Login to Your Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwindtemplate.js"></script>
  <script src="interface.js"></script>
</head>
<body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans antialiased transition-colors duration-300 bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 relative">

  <div class="absolute top-4 right-4 sm:top-6 sm:right-6">
    <button id="theme-toggle-btn" onclick="toggleTheme()" type="button" class="p-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-700 transition focus:outline-none shadow-md" aria-label="Toggle Theme">
      <svg id="theme-sun-icon" class="w-5 h-5 text-amber-500 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg id="theme-moon-icon" class="w-5 h-5 text-slate-700 fill-none stroke-current stroke-2 hidden" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
      <a href="index.html" class="inline-flex items-center gap-2 font-bold text-2xl tracking-tight text-slate-900 dark:text-white mb-2">
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-brand-600 text-white font-black shadow-lg shadow-brand-500/30">
          E
        </span>
      <span>Event<span class="text-brand-500">Hub</span></span>
    </a>
    <h2 class="text-xl font-bold tracking-tight text-slate-800 dark:text-slate-200">
      Welcome to EventHub Platform
    </h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
      Sign in to manage your workshop bookings or create a new account.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
      <div class="bg-white border border-slate-200 dark:bg-slate-800/80 dark:border-slate-700/60 backdrop-blur-xl rounded-3xl p-6 sm:p-8 shadow-xl transition-all duration-300">
      
        <div class="flex rounded-xl bg-slate-100 dark:bg-slate-900/60 p-1 border border-slate-200 dark:border-slate-700/50 mb-6">
          <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-900 bg-white dark:text-white dark:bg-slate-800 shadow transition-all duration-200">
            Sign In
          </button>
            <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-all duration-200">
              Create Account
            </button>
      </div>

      <div id="alert-banner" class="hidden mb-5 p-3 rounded-xl text-xs font-medium text-center transition-all"></div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            Email Address
          </label>
          <input 
            type="email" 
            id="login-email" 
            required 
            placeholder="you@university.edu"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm placeholder-slate-400 dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
              Password
            </label>
            <a href="#" class="text-xs font-semibold text-brand-600 dark:text-brand-500 hover:text-brand-500 transition">Forgot?</a>
          </div>
          <div class="relative">
            <input 
              type="password" 
              id="login-password" 
              placeholder="••••••••" 
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 dark:bg-slate-900 dark:border-slate-700 dark:text-white pr-10 focus:outline-none focus:ring-2 focus:ring-brand-500 transition"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility('login-password', this)" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white transition focus:outline-none"
            >
              <svg class="w-5 h-5 text-slate-400 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <line x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center">
          <input 
            type="checkbox" 
            id="remember-me" 
            class="h-4 w-4 rounded border-slate-300 bg-slate-50 text-brand-600 dark:border-slate-700 dark:bg-slate-900 focus:ring-brand-500"
          />
          <label for="remember-me" class="ml-2 block text-xs text-slate-600 dark:text-slate-300">Remember me on this device</label>
        </div>

        <button 
          type="submit" 
          class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 active:bg-brand-700 transition shadow-lg shadow-brand-600/25 mt-2"
        >
          Sign In
        </button>
      </form>

      <form id="register-form" onsubmit="handleRegister(event)" class="hidden space-y-4">
        <div>
          <label for="reg-name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            Full Name
          </label>
          <input type="text" id="reg-name" required placeholder="John Doe" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm placeholder-slate-400 dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"/>
        </div>

        <div>
          <label for="reg-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            University Email
          </label>
          <input 
            type="email" 
            id="reg-email" 
            required 
            placeholder="student@university.edu"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm placeholder-slate-400 dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
          />
        </div>

        <div>
          <label for="reg-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            Create Password
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="reg-password" 
              required 
              minlength="6"
              placeholder="At least 6 characters"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition pr-10"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility('reg-password', this)"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white focus:outline-none"
            >
              👁
            </button>
          </div>
        </div>

        <div>
          <label for="reg-confirm-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            Confirm Password
          </label>
          <input 
            type="password" 
            id="reg-confirm-password" 
            required 
            placeholder="Repeat password"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm placeholder-slate-400 dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
          />
        </div>

        <button 
          type="submit" 
          class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 active:bg-brand-700 transition shadow-lg shadow-brand-600/25 mt-2"
        >
          Create Account
        </button>
      </form>

    </div>

    <div class="text-center mt-6">
      <a href="index.html" class="text-xs font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition inline-flex items-center gap-1">
        ← Back to Events Home
      </a>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
