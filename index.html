<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindIt — Welcome & Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwindtemplate.js"></script>
  <script src="interface.js"></script>
</head>
<body class="min-h-full flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-300 bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">

  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-slate-200 dark:bg-slate-900/80 dark:border-slate-800 transition-colors duration-300">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center gap-3">
          <a href="home.html" class="group flex items-center gap-2.5 transition-transform duration-200 hover:scale-[1.02]">
            <div class="relative flex items-center justify-center w-10 h-10 rounded-2xl bg-gradient-to-br from-brand-500 via-brand-600 to-indigo-700 text-white shadow-lg shadow-brand-500/25 group-hover:shadow-brand-500/40 transition-all duration-300">
              <svg class="w-5.5 h-5.5 text-white transform transition-transform duration-300 group-hover:rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
              </svg>
            </div>
            <span class="font-['Plus_Jakarta_Sans',sans-serif] text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center">
              Find<span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-indigo-500 ml-0.5">It</span>
            </span>
          </a>
        </div>

        <div class="flex items-center gap-3">
          <button id="theme-toggle-btn" onclick="toggleTheme()" type="button" class="p-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:text-white transition focus:outline-none shadow-md" aria-label="Toggle Theme">
            <svg id="theme-sun-icon" class="w-5 h-5 text-amber-500 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-moon-icon" class="w-5 h-5 text-slate-700 fill-none stroke-current stroke-2 hidden" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>

      </div>
    </nav>
  </header>

  <main class="flex-grow flex items-center justify-center p-6 my-8">
    <div class="w-full max-w-md bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 rounded-3xl p-8 shadow-2xl">
      
      <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Welcome to FindIt</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Sign in or create an account to book campus events.</p>
      </div>

      <div id="alert-banner" class="hidden mb-6 p-4 rounded-xl text-sm font-medium text-center transition"></div>

      <div class="flex p-1 mb-6 space-x-1 bg-slate-100 dark:bg-slate-900/50 rounded-xl">
        <button type="button" id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-900 bg-white dark:text-white dark:bg-slate-800 shadow transition-all duration-200">Log In</button>
        <button type="button" id="tab-register-btn" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-all duration-200">Register</button>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">University Email</label>
          <input type="email" id="login-email" required placeholder="user@fcai.cu.edu.eg" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition" />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Password</label>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition pr-10" />
            <button type="button" onclick="togglePasswordVisibility('login-password', 'login-eye-icon')" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition focus:outline-none">
              <svg id="login-eye-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex justify-end">
          <button type="button" onclick="openForgotPasswordModal()" class="text-xs font-semibold text-brand-600 hover:text-brand-500 dark:text-brand-400 transition">Forgot password?</button>
        </div>

        <button type="submit" class="w-full py-3 mt-2 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl transition shadow-lg shadow-brand-600/25">
          Log In
        </button>
      </form>

      <form id="register-form" onsubmit="handleRegister(event)" class="hidden space-y-4">
        <div>
          <label for="reg-name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Full Name</label>
          <input type="text" id="reg-name" required placeholder="John Doe" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition" />
        </div>

        <div>
          <label for="reg-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">University Email</label>
          <input type="email" id="reg-email" required placeholder="user@fcai.cu.edu.eg" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="reg-dob" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Date of Birth</label>
            <input type="date" id="reg-dob" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition" />
          </div>
          <div>
            <label for="reg-gender" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Gender</label>
            <select id="reg-gender" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
        </div>

        <div>
          <label for="reg-year" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Academic Year</label>
          <select id="reg-year" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
            <option value="Freshman">Freshman (Year 1)</option>
            <option value="Sophomore">Sophomore (Year 2)</option>
            <option value="Junior">Junior (Year 3)</option>
            <option value="Senior">Senior (Year 4)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Interests / Tracks</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700/60 cursor-pointer">
              <input type="checkbox" value="Technical Tracks" class="track-checkbox h-4 w-4 rounded text-brand-600 focus:ring-brand-500" />
              <span>Technical</span>
            </label>
            <label class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700/60 cursor-pointer">
              <input type="checkbox" value="Digital Marketing" class="track-checkbox h-4 w-4 rounded text-brand-600 focus:ring-brand-500" />
              <span>Marketing</span>
            </label>
            <label class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700/60 cursor-pointer">
              <input type="checkbox" value="PR & Media" class="track-checkbox h-4 w-4 rounded text-brand-600 focus:ring-brand-500" />
              <span>PR & Media</span>
            </label>
            <label class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700/60 cursor-pointer">
              <input type="checkbox" value="HR & Logistics" class="track-checkbox h-4 w-4 rounded text-brand-600 focus:ring-brand-500" />
              <span>HR & Logistics</span>
            </label>
          </div>
        </div>

        <div>
          <label for="reg-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Password</label>
          <div class="relative">
            <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition pr-10" />
            <button type="button" onclick="togglePasswordVisibility('reg-password', 'reg-eye-icon')" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition focus:outline-none">
              <svg id="reg-eye-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full py-3 mt-4 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl transition shadow-lg shadow-brand-600/25">
          Create Account
        </button>
      </form>
    </div>
  </main>

  <div id="forgot-password-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm transition-opacity">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 sm:p-8 w-full max-w-sm shadow-2xl relative">
      <button type="button" onclick="closeForgotPasswordModal()" class="absolute top-4 right-4 p-2 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-700 dark:hover:text-slate-300 transition focus:outline-none">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Reset Password</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">Enter your email and a new password to reset your account credentials.</p>

      <div id="modal-alert-banner" class="hidden mb-4 p-3 rounded-xl text-xs font-medium text-center transition"></div>

      <form onsubmit="handleResetPassword(event)" class="space-y-4">
        <div>
          <label for="forgot-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Email Address</label>
          <input type="email" id="forgot-email" required class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition" />
        </div>
        <div>
          <label for="forgot-new-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">New Password</label>
          <div class="relative">
            <input type="password" id="forgot-new-password" required minlength="6" class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500 transition pr-10" />
            <button type="button" onclick="togglePasswordVisibility('forgot-new-password', 'forgot-eye-icon')" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition focus:outline-none">
              <svg id="forgot-eye-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 mt-2 bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold rounded-xl transition shadow-md shadow-brand-600/25">
          Update Password
        </button>
      </form>
    </div>
  </div>

  <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/80 py-6 transition mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400">
      © 2026 FindIt Platform. Showing you what you've been looking for!
    </div>
  </footer>

  <script src="login.js"></script>
  <script src="menu.js"></script>
</body>
</html>
