<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindIt — Register & Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwindtemplate.js"></script>
  <script src="interface.js"></script>
  
</head>
<body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans antialiased transition-colors duration-300 bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 relative">

  <div class="absolute top-4 right-4 sm:top-6 sm:right-6">
    <button id="theme-toggle-btn" onclick="toggleTheme()" type="button" class="p-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:text-white transition focus:outline-none shadow-md" aria-label="Toggle Theme">
      <svg id="theme-sun-icon" class="w-5 h-5 text-amber-500 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
      <svg id="theme-moon-icon" class="w-5 h-5 text-slate-700 fill-none stroke-current stroke-2 hidden" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <p class="inline-flex items-center gap-2 font-bold text-2xl tracking-tight text-slate-900 dark:text-white mb-2">
      <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-brand-600 text-white font-black shadow-lg shadow-brand-500/30">
        F
      </span>
      <span>Find<span class="text-brand-500">It</span></span>
    
    <h2 class="text-xl font-bold tracking-tight text-slate-800 dark:text-slate-200">
      Welcome to FindIt Platform
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-lg px-4 sm:px-0">
    <div class="bg-white border border-slate-200 dark:bg-slate-800/80 dark:border-slate-700/60 rounded-3xl p-6 sm:p-8 shadow-xl transition-all">
      
      <div class="flex rounded-xl bg-slate-100 dark:bg-slate-900/60 p-1 border border-slate-200 dark:border-slate-700/50 mb-6">
        <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-900 bg-white dark:text-white dark:bg-slate-800 shadow transition-all">
          Sign In
        </button>
        <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-all">
          Create Account
        </button>
      </div>

      <div id="alert-banner" class="hidden mb-5 p-3 rounded-xl text-xs font-medium text-center transition-all"></div>

      
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            Email Address
          </label>
          <input type="email" id="login-email" required placeholder="student@fci.**.edu.eg" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none" />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
    Password
  </label>
  <div class="relative">
    <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2.5 pr-10 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none" />
    <button type="button" onclick="togglePasswordVisibility('login-password', 'login-pass-eye')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="Toggle password visibility">
      <svg id="login-pass-eye" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
    </button>
  </div>
        
</div>
    <div class="flex items-center justify-end mb-1">
      <button type="button" onclick="openForgotPasswordModal()" class="text-xs text-brand-600 hover:text-brand-500 dark:text-brand-400 font-medium transition"> Forgot Password?</button>
    </div>



        <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 transition shadow-lg shadow-brand-600/25 mt-2">
          Sign In
        </button>
      </form>

      
      <form id="register-form" onsubmit="handleRegister(event)" class="hidden space-y-4">
        <div>
          <label for="reg-name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Full Name</label>
          <input type="text" id="reg-name" required placeholder="Youssef Khaled" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none" />
        </div>

        <div>
          <label for="reg-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">University Email</label>
          <input type="email" id="reg-email" required placeholder="student@fci.**.edu.eg" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="reg-dob" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
  Date of Birth
</label>
<input type="date" id="reg-dob" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-xs dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none"/>
<p class="text-[10px] text-slate-400 mt-1">Must be born prior to the current year.</p>
          </div>
          <div>
            <label for="reg-gender" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Gender</label>
            <select id="reg-gender" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-xs dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
        </div>

        <div>
          <label for="reg-year" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Academic Year</label>
          <select id="reg-year" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none">
            <option value="Freshman">Freshman (Year 1)</option>
            <option value="Sophomore">Sophomore (Year 2)</option>
            <option value="Junior">Junior (Year 3)</option>
            <option value="Senior">Senior (Year 4)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Track Preferences</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700/60 cursor-pointer">
              <input type="checkbox" value="Technical Tracks" class="track-checkbox h-4 w-4 rounded text-brand-600 focus:ring-brand-500" checked />
              <span>Technical Tracks</span>
            </label>
            <label class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700/60 cursor-pointer">
              <input type="checkbox" value="Digital Marketing" class="track-checkbox h-4 w-4 rounded text-brand-600 focus:ring-brand-500" />
              <span>Digital Marketing</span>
            </label>
            <label class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700/60 cursor-pointer">
              <input type="checkbox" value="PR & Media" class="track-checkbox h-4 w-4 rounded text-brand-600 focus:ring-brand-500" />
              <span>PR & Media</span>
            </label>
            <label class="flex items-center gap-2 p-2 bg-slate-50 dark:bg-slate-900/50 rounded-lg border border-slate-200 dark:border-slate-700/60 cursor-pointer">
              <input type="checkbox" value="HR & Logistics" class="track-checkbox h-4 w-4 rounded text-brand-600 focus:ring-brand-500" />
              <span>HR & Logistics</span>
            </label>
          </div>
        </div>

        <div>
  <label for="reg-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
    Password
  </label>
  <div class="relative">
    <input type="password" id="reg-password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-2.5 pr-10 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none" />
    <button type="button" onclick="togglePasswordVisibility('reg-password', 'reg-pass-eye')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="Toggle password visibility">
      <svg id="reg-pass-eye" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
    </button>
  </div>
</div>

        <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 transition shadow-lg shadow-brand-600/25 mt-2">
          Create Account
        </button>
      </form>

    </div>
  </div>

  <script src="login.js"></script>
  <div id="forgot-password-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden px-4">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl relative transition-all">
      
      <button type="button" onclick="closeForgotPasswordModal()" class="absolute top-4 right-4 p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition" aria-label="Close modal">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

  <div class="text-center mb-6">
  <div class="w-12 h-12 rounded-2xl bg-white text-slate-800 dark:bg-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 shadow-sm flex items-center justify-center mx-auto mb-3">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z" />
    </svg>
  </div>
  <h3 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Reset Your Password</h3>
  <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your university email address and your new password.</p>
</div>

      <div id="modal-alert-banner" class="hidden mb-4 p-3 rounded-xl text-xs font-medium text-center transition-all"></div>

      <form id="forgot-password-form" onsubmit="handleResetPassword(event)" class="space-y-4">
        <div>
          <label for="forgot-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            University Email Address
          </label>
          <input type="email" id="forgot-email" required placeholder="student@fci.**.edu.eg" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none" />
        </div>

        <div>
          <label for="forgot-new-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            New Password
          </label>
          <div class="relative">
    <input type="password" id="forgot-new-password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-2.5 pr-10 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 outline-none" />
    <button type="button" onclick="togglePasswordVisibility('forgot-new-password', 'forgot-pass-eye')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="Toggle password visibility">
      <svg id="forgot-pass-eye" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
    </button>
  </div>
  </div>
        <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 transition shadow-lg shadow-brand-600/25 mt-2">
          Reset Password
        </button>
      </form>
    </div>
  </div>
</body>
</html>
